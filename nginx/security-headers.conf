# The map loads styles, tiles, fonts and sprites from OpenFreeMap (connect-src) and turns
# sprites into blob: images (img-src). Its worker is served from this origin, so worker-src
# stays 'self' with no blob: workers and no unsafe-eval.
# Included in every location that sets its own headers: nginx drops inherited
# add_header directives as soon as a location declares one of its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
