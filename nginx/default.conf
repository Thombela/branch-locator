server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness probe for Docker / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        # nginx has no type for .mjs, and with nosniff a module worker served as
        # application/octet-stream is refused.
        location ~ \.mjs$ {
            types { text/javascript mjs; }
            try_files $uri =404;
        }
    }

    # The mock API's service worker must always be revalidated.
    location = /mockServiceWorker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA: every path loads the app, which sends unknown paths to the locator.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
